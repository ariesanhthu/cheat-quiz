<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz Assistant</title>
<style>
*{box-sizing:border-box}body{width:320px;margin:0;padding:18px;font:14px/1.45 system-ui,sans-serif;color:#172033;background:#fff}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:17px;margin:0}small{font-size:11px;color:#667085}fieldset{display:flex;gap:8px;border:0;padding:0;margin:0 0 14px}legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}label{flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:8px;cursor:pointer}label:has(input:checked){background:#edf4ff;border-color:#2864c6}input{accent-color:#2864c6}button,a{font:inherit}button{border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer;color:inherit}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #a6c8ff;outline-offset:2px}#run{width:100%;color:#fff;background:#2864c6;border-color:#2864c6;margin:14px 0 10px;font-weight:600}#status{margin:10px 0;min-height:20px;overflow-wrap:anywhere}#account{background:#f8fafc;border-radius:8px;padding:12px}#account p{margin:0 0 10px}#account button{padding:6px 9px;font-size:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}a{font-size:12px;color:#52647e;text-decoration:none}#cancel{padding:5px 9px;font-size:12px}details{font-size:12px;margin-top:12px;color:#52647e}summary{cursor:pointer}code{font-size:11px;word-break:break-all;user-select:all}#setup{line-height:1.6}[hidden]{display:none!important}
</style></head><body>
<header><h1>Quiz Assistant</h1><small id="version"></small></header>
<fieldset><legend>Chế độ trả lời</legend><label><input type="radio" name="mode" value="tfidf" checked> TF-IDF</label><label><input type="radio" name="mode" value="chatgpt"> ChatGPT</label></fieldset>
<div id="local">Tra kho trên máy. Khớp là tự chọn đáp án.</div>
<div id="account" hidden><p id="accountStatus" role="status">Đang kiểm tra kết nối…</p><div class="row"><button id="login" type="button">Đăng nhập</button><button id="test" type="button">Thử kết nối</button></div>
<details id="setup"><summary>Cài kết nối một lần</summary><p>Trong thư mục vừa giải nén, chạy <b>SETUP.cmd</b>. Sau đó bấm Đăng nhập ở đây. Bộ kết nối tự nhận extension; không cần nhập token.</p><p>Nếu được hỏi ID, sao chép:</p><code id="extensionId"></code></details></div>
<p id="status" role="status" aria-live="polite">Đang tải…</p>
<button id="run" type="button">Chạy</button><div class="row"><button id="cancel" type="button">Dừng</button><a href="settings.html" target="_blank" rel="noopener">Cài đặt nâng cao</a></div>
<script src="popup.js"></script></body></html>
